name: ptcgsim

services:

  app:
    image: ptcgsim-app
    build:
      context: ..
      dockerfile: ./docker/web/Dockerfile
    user: node
    working_dir: /app/server
    environment:
      NODE_ENV: production
    expose:
      - 4000
    ports:
      - 4000:4000 
    volumes:
      - ../server/database/:/app/server/database

  storybook:
    image: ptcgsim-storybook
    build:
      context: ..
      dockerfile: ./docker/storybook/Dockerfile
    expose:
      - 80
    ports:
      - 8080:80 
